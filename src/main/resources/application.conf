app {
  name = "EcommerceAnalytics"

  spark {
    master = "local[*]"
    shuffle.partitions = 8
  }

  optimization {
    enable-cache = true
    enable-broadcast = true
  }

  data {
    input {
      transactions = "D:/MASTER_IA_DIT/Semestre_2/Data Engineering/Projet_DE/EcommerceAnalytics/src/main/resources/data/transactions.csv"
      users = "D:/MASTER_IA_DIT/Semestre_2/Data Engineering/Projet_DE/EcommerceAnalytics/src/main/resources/data/users.json"
      products = "D:/MASTER_IA_DIT/Semestre_2/Data Engineering/Projet_DE/EcommerceAnalytics/src/main/resources/data/products.parquet"
      merchants = "D:/MASTER_IA_DIT/Semestre_2/Data Engineering/Projet_DE/EcommerceAnalytics/src/main/resources/data/merchants.csv"
    }
    output {
      path = "D:/MASTER_IA_DIT/Semestre_2/Data Engineering/Projet_DE/EcommerceAnalytics/output/"
    }
  }

  validation {
    transaction {
      min-amount = 0.0
      timestamp-length = 14
    }
    user {
      min-age = 16
      max-age = 100
      min-income = 0.0
    }
    product {
      min-price = 0.0
      min-rating = 1.0
      max-rating = 5.0
    }
    merchant {
      min-commission = 0.0
      max-commission = 1.0
    }
  }
}
